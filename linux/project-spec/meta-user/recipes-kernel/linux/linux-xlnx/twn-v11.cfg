# v1.1 kernel options, on top of the PetaLinux 2023.2 defaults.
#
# /dev/mem may reach only I/O ranges that no driver has claimed: with the twn_fuse driver loaded,
# neither the accelerator's registers nor any RAM can be mapped through /dev/mem any more.
CONFIG_STRICT_DEVMEM=y
CONFIG_IO_STRICT_DEVMEM=y
# The SMMU (MMU-500) driver, so that the accelerator's DMA is confined to its buffer (the
# release device tree enables the SMMU, see system-user.dtsi). A master the device tree does
# not list keeps working untranslated (bypass) instead of faulting; arm_smmu.disable_bypass=1 on
# the kernel command line makes such a master fault and report its stream ID.
CONFIG_ARM_SMMU=y
# CONFIG_ARM_SMMU_DISABLE_BYPASS_BY_DEFAULT is not set
