<svg xmlns="http://www.w3.org/2000/svg" width="880" height="430" viewBox="0 0 880 430" font-family="Helvetica, Arial, sans-serif" font-size="13">
  <title>zynq-ternary-mobilenet-codesign system architecture</title>
  <rect x="0" y="0" width="880" height="430" fill="#ffffff"/>
  <!-- processing system -->
  <rect x="20" y="40" width="220" height="172" rx="8" fill="#eef3fb" stroke="#3d6bb3" stroke-width="1.5"/>
  <text x="130" y="62" text-anchor="middle" font-weight="bold">Processing system</text>
  <text x="130" y="77" text-anchor="middle" font-size="11">ARM Cortex-A53, Linux</text>
  <rect x="40" y="88" width="180" height="56" rx="5" fill="#ffffff" stroke="#3d6bb3"/>
  <text x="130" y="108" text-anchor="middle">board apps (sw/app)</text>
  <text x="130" y="125" text-anchor="middle" font-size="11">input quantisation, control,</text>
  <text x="130" y="138" text-anchor="middle" font-size="11">heatmap arg-max</text>
  <rect x="40" y="158" width="180" height="40" rx="5" fill="#ffffff" stroke="#3d6bb3"/>
  <text x="130" y="183" text-anchor="middle">UIO driver (pl_hal_fuse.c)</text>
  <!-- DDR4 is off-chip; the PL reaches it through the HP ports and the PS DDR controller -->
  <rect x="20" y="226" width="220" height="164" rx="8" fill="#ede7f6" stroke="#4527a0" stroke-width="1.5"/>
  <text x="130" y="244" text-anchor="middle" font-weight="bold">DDR4 (off-chip), 256 MB arena</text>
  <text x="130" y="260" text-anchor="middle" font-size="11">backbone weights</text>
  <text x="130" y="276" text-anchor="middle" font-size="11">input image</text>
  <text x="130" y="292" text-anchor="middle" font-size="11">activation slots 0 / 1</text>
  <text x="130" y="308" text-anchor="middle" font-size="11">head weights</text>
  <text x="130" y="324" text-anchor="middle" font-size="11">head input slots, intermediates</text>
  <text x="130" y="340" text-anchor="middle" font-size="11">heatmap boxes A / B</text>
  <text x="130" y="360" text-anchor="middle" font-size="10" fill="#555">uncached, at 0x6000_0000;</text>
  <text x="130" y="374" text-anchor="middle" font-size="10" fill="#555">HP ports via the PS DDR controller</text>
  <!-- PL -->
  <rect x="300" y="20" width="560" height="390" rx="8" fill="#fbf4ea" stroke="#b37a2e" stroke-width="1.5"/>
  <text x="580" y="44" text-anchor="middle" font-weight="bold">Programmable logic, 240 MHz: twn_fuse_top</text>
  <rect x="320" y="60" width="200" height="56" rx="5" fill="#ffffff" stroke="#b37a2e"/>
  <text x="420" y="82" text-anchor="middle">twn_csr: registers,</text>
  <text x="420" y="100" text-anchor="middle">descriptor table, head tables</text>
  <rect x="320" y="136" width="520" height="140" rx="5" fill="#ffffff" stroke="#b37a2e"/>
  <text x="580" y="158" text-anchor="middle" font-weight="bold">Backbone engine: 17 fused MobileNetV2 blocks, row-streamed</text>
  <rect x="336" y="172" width="118" height="88" rx="4" fill="#fff7e6" stroke="#c98a2e"/>
  <text x="395" y="198" text-anchor="middle">1x1 expand</text>
  <text x="395" y="216" text-anchor="middle" font-size="11">ternary array</text>
  <text x="395" y="232" text-anchor="middle" font-size="11">(adder trees,</text>
  <text x="395" y="246" text-anchor="middle" font-size="11">no multipliers)</text>
  <rect x="466" y="172" width="118" height="88" rx="4" fill="#fff7e6" stroke="#c98a2e"/>
  <text x="525" y="198" text-anchor="middle">3x3 depthwise</text>
  <text x="525" y="216" text-anchor="middle" font-size="11">INT8, DSP lanes</text>
  <rect x="596" y="172" width="118" height="88" rx="4" fill="#fff7e6" stroke="#c98a2e"/>
  <text x="655" y="198" text-anchor="middle">1x1 project</text>
  <text x="655" y="216" text-anchor="middle" font-size="11">ternary array</text>
  <rect x="726" y="172" width="100" height="88" rx="4" fill="#fff7e6" stroke="#c98a2e"/>
  <text x="776" y="198" text-anchor="middle">residual</text>
  <text x="776" y="216" text-anchor="middle">add</text>
  <text x="776" y="236" text-anchor="middle" font-size="11">(10 blocks)</text>
  <line x1="454" y1="216" x2="466" y2="216" stroke="#333" stroke-width="1.2"/>
  <line x1="584" y1="216" x2="596" y2="216" stroke="#333" stroke-width="1.2"/>
  <line x1="714" y1="216" x2="726" y2="216" stroke="#333" stroke-width="1.2"/>
  <rect x="320" y="296" width="520" height="96" rx="5" fill="#ffffff" stroke="#b37a2e"/>
  <text x="580" y="318" text-anchor="middle" font-weight="bold">Head engine (twn_hd_seq + twn_hd_compute)</text>
  <text x="580" y="340" text-anchor="middle">three 4x4 stride-2 transposed convolutions, 32 channels, INT8</text>
  <text x="580" y="358" text-anchor="middle">final 1x1 to 16 channels (14 joint heatmaps of 64 x 64)</text>
  <text x="580" y="380" text-anchor="middle" font-size="11" fill="#555">runs on frame k-1 while the backbone runs on frame k</text>
  <!-- connections -->
  <line x1="220" y1="178" x2="320" y2="88" stroke="#3d6bb3" stroke-width="1.5"/>
  <text x="262" y="122" text-anchor="middle" font-size="11" fill="#3d6bb3" transform="rotate(-42 262 122)">AXI4-Lite</text>
  <line x1="220" y1="260" x2="320" y2="230" stroke="#b37a2e" stroke-width="2"/>
  <text x="270" y="236" text-anchor="middle" font-size="11" fill="#b37a2e">HP0, HP1</text>
  <line x1="220" y1="330" x2="320" y2="344" stroke="#b37a2e" stroke-width="2"/>
  <text x="270" y="330" text-anchor="middle" font-size="11" fill="#b37a2e">HP2, HP3</text>
  <line x1="580" y1="276" x2="580" y2="296" stroke="#333" stroke-width="1.2"/>
  <text x="590" y="291" font-size="10" fill="#555">block 16 writes the head input slot in DDR (BB2HD)</text>
</svg>
