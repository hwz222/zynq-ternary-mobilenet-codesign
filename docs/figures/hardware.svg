<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="600" viewBox="0 0 1060 600" font-family="Helvetica, Arial, sans-serif" font-size="14">
  <title>zynq-ternary-mobilenet-codesign hardware</title>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
    <marker id="ahO" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e65100"/>
    </marker>
    <marker id="ahB" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="11" markerHeight="11" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/>
    </marker>
    <marker id="ahV" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="13" markerHeight="13" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4527a0"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1060" height="600" fill="#ffffff"/>

  <!-- board -->
  <rect x="160" y="16" width="884" height="568" rx="14" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2"/>
  <text x="180" y="44" font-size="17" font-weight="bold" fill="#1b5e20">ALINX AXU2CGB board</text>

  <!-- SoC -->
  <rect x="180" y="60" width="844" height="380" rx="10" fill="#fafafa" stroke="#424242" stroke-width="2.5"/>
  <text x="602" y="84" text-anchor="middle" font-size="16" font-weight="bold" fill="#212121">XCZU2CG: Zynq UltraScale+ MPSoC (one chip)</text>

  <!-- PS -->
  <rect x="198" y="98" width="304" height="326" rx="8" fill="#e3f2fd" stroke="#1565c0" stroke-width="2"/>
  <text x="350" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#0d47a1">Processing system (PS)</text>
  <rect x="214" y="138" width="272" height="60" rx="6" fill="#ffffff" stroke="#1565c0"/>
  <text x="350" y="163" text-anchor="middle" font-weight="bold">2x Arm Cortex-A53</text>
  <text x="350" y="183" text-anchor="middle" font-size="12.5">Linux, control software</text>
  <rect x="214" y="216" width="272" height="44" rx="6" fill="#ffffff" stroke="#1565c0"/>
  <text x="350" y="243" text-anchor="middle" font-size="13">USB, Ethernet, SD controllers</text>
  <rect x="214" y="310" width="272" height="44" rx="6" fill="#bbdefb" stroke="#1565c0"/>
  <text x="350" y="337" text-anchor="middle" font-weight="bold" font-size="13.5">DDR controller</text>

  <!-- PL -->
  <rect x="552" y="98" width="456" height="326" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="2"/>
  <text x="780" y="122" text-anchor="middle" font-size="15" font-weight="bold" fill="#bf360c">Programmable logic (PL), 240 MHz: the accelerator</text>
  <rect x="584" y="136" width="408" height="36" rx="6" fill="#ffffff" stroke="#e65100"/>
  <text x="788" y="159" text-anchor="middle" font-size="13">registers, descriptor tables</text>
  <rect x="584" y="184" width="408" height="134" rx="6" fill="#ffffff" stroke="#e65100"/>
  <text x="788" y="205" text-anchor="middle" font-size="13.5" font-weight="bold">backbone: 17 fused MobileNetV2 blocks</text>
  <rect x="596" y="220" width="124" height="84" rx="5" fill="#ffe0b2" stroke="#ef6c00"/>
  <text x="658" y="256" text-anchor="middle" font-weight="bold" font-size="13.5">ternary 1x1</text>
  <text x="658" y="276" text-anchor="middle" font-size="12">no multipliers</text>
  <rect x="728" y="220" width="124" height="84" rx="5" fill="#ffecb3" stroke="#ef6c00"/>
  <text x="790" y="256" text-anchor="middle" font-weight="bold" font-size="13.5">depthwise 3x3</text>
  <text x="790" y="276" text-anchor="middle" font-size="12">INT8, DSP</text>
  <rect x="860" y="220" width="124" height="84" rx="5" fill="#ffe0b2" stroke="#ef6c00"/>
  <text x="922" y="256" text-anchor="middle" font-weight="bold" font-size="13.5">ternary 1x1</text>
  <text x="922" y="276" text-anchor="middle" font-size="12">project + residual</text>
  <line x1="720" y1="262" x2="728" y2="262" stroke="#37474f" stroke-width="1.5"/>
  <line x1="852" y1="262" x2="860" y2="262" stroke="#37474f" stroke-width="1.5"/>
  <rect x="584" y="346" width="408" height="62" rx="6" fill="#ffccbc" stroke="#e65100"/>
  <text x="788" y="371" text-anchor="middle" font-size="13.5" font-weight="bold">output head, INT8</text>
  <text x="788" y="391" text-anchor="middle" font-size="12">transposed convolutions + 1x1</text>

  <!-- memory bus inside the PL: shared by backbone and head -->
  <line x1="568" y1="251" x2="568" y2="377" stroke="#e65100" stroke-width="4"/>
  <line x1="566" y1="251" x2="584" y2="251" stroke="#e65100" stroke-width="4"/>
  <line x1="566" y1="377" x2="584" y2="377" stroke="#e65100" stroke-width="4"/>

  <!-- PS <-> PL -->
  <line x1="486" y1="166" x2="582" y2="154" stroke="#1565c0" stroke-width="2.2" marker-end="url(#ahB)"/>
  <text x="530" y="148" text-anchor="middle" font-size="11.5" fill="#1565c0">AXI4-Lite</text>
  <line x1="488" y1="332" x2="566" y2="332" stroke="#e65100" stroke-width="4" marker-start="url(#ahO)" marker-end="url(#ahO)"/>
  <rect x="503" y="301" width="48" height="20" rx="4" fill="#e65100"/>
  <text x="527" y="315" text-anchor="middle" font-size="11.5" font-weight="bold" fill="#ffffff">HP0-3</text>

  <!-- off-chip -->
  <rect x="270" y="472" width="320" height="76" rx="8" fill="#ede7f6" stroke="#4527a0" stroke-width="2"/>
  <text x="430" y="502" text-anchor="middle" font-size="15" font-weight="bold" fill="#311b92">DDR4, 2 GB (off-chip)</text>
  <text x="430" y="526" text-anchor="middle" font-size="12.5">256 MB reserved for the accelerator</text>
  <line x1="350" y1="356" x2="350" y2="470" stroke="#4527a0" stroke-width="4" marker-start="url(#ahV)" marker-end="url(#ahV)"/>
  <rect x="640" y="472" width="250" height="76" rx="8" fill="#f5f5f5" stroke="#616161" stroke-width="1.5"/>
  <text x="765" y="497" text-anchor="middle" font-size="14" font-weight="bold">microSD (boot)</text>
  <text x="765" y="516" text-anchor="middle" font-size="12">BOOT.BIN (bitstream + boot firmware),</text>
  <text x="765" y="533" text-anchor="middle" font-size="12">kernel Image, initramfs</text>

  <!-- outside the board -->
  <rect x="14" y="146" width="128" height="62" rx="10" fill="#fce4ec" stroke="#ad1457" stroke-width="1.8"/>
  <text x="78" y="172" text-anchor="middle" font-weight="bold" fill="#880e4f">USB camera</text>
  <text x="78" y="192" text-anchor="middle" font-size="12">images in</text>
  <path d="M 142 177 L 180 177 L 180 228 L 212 228" fill="none" stroke="#ad1457" stroke-width="2.2" marker-end="url(#ah)"/>
  <rect x="14" y="262" width="128" height="62" rx="10" fill="#e0f7fa" stroke="#00838f" stroke-width="1.8"/>
  <text x="78" y="288" text-anchor="middle" font-weight="bold" fill="#006064">Host PC</text>
  <text x="78" y="308" text-anchor="middle" font-size="12">keypoints out</text>
  <path d="M 142 293 L 190 293 L 190 248 L 212 248" fill="none" stroke="#00838f" stroke-width="2.2" marker-start="url(#ah)" marker-end="url(#ah)"/>
  <text x="146" y="286" font-size="11" fill="#006064">Ethernet</text>
</svg>
